# Builds fastcnsl for every platform. Unit tests are not run here; run
# them locally with `make tests`.
#
# - Push to main: lints, all packages, then a GitHub release. Every run
#   on main is a release: version 0.1.<commits on main> (scripts/get_version.sh),
#   tag v0.1.<commits>, marked "latest". The .deb then also goes to the
#   apt and rpm repositories on GitHub Pages (job repos).
# - Pull requests: lints + all packages, uploaded as workflow artifacts.
#
# Linux and Windows packages are built with the same Docker images and
# Makefile targets as locally. Windows gets a portable .zip and an
# installer (-setup.exe, Inno Setup under Wine) per architecture. macOS is built natively on GitHub's Apple
# Silicon runner, which has Apple's own SDK, so CI never downloads the
# macOS SDK from a third-party mirror (make macos-arm64 does that locally).

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Runs on main are
# never cancelled: each one becomes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-dev-
      - run: make clippy

  docker-packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            packages: linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage
          - target: windows-x86_64
            packages: windows-x86_64-zip windows-x86_64-setup
          - target: windows-arm64
            packages: windows-arm64-zip windows-arm64-setup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the version counts commits
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-
      - name: Compile
        run: make ${{ matrix.target }}
      - name: Package
        run: make ${{ matrix.packages }}
      - uses: actions/upload-artifact@v4
        with:
          name: fastcnsl-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rustup toolchain install 1.91 --profile minimal --target aarch64-apple-darwin
          rustup default 1.91
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - name: Compile
        run: scripts/package/macos-arm64.sh build
      - name: Package
        run: scripts/package/macos-arm64.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: fastcnsl-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, docker-packages, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: echo "VERSION=$(scripts/get_version.sh)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Fixed names (no version) so README links to releases/latest/download/
      # always point at the newest build.
      - name: Name the files for download links
        run: |
          mkdir upload
          cp dist/fastcnsl_*_amd64.deb          upload/fastcnsl-linux-x86_64.deb
          cp dist/fastcnsl-*.x86_64.rpm         upload/fastcnsl-linux-x86_64.rpm
          cp dist/Fastcnsl-*-x86_64.AppImage    upload/fastcnsl-linux-x86_64.AppImage
          cp dist/fastcnsl-*-windows-x86_64.zip upload/fastcnsl-windows-x86_64.zip
          cp dist/fastcnsl-*-windows-arm64.zip  upload/fastcnsl-windows-arm64.zip
          cp dist/fastcnsl-*-windows-x86_64-setup.exe upload/fastcnsl-windows-x86_64-setup.exe
          cp dist/fastcnsl-*-windows-arm64-setup.exe  upload/fastcnsl-windows-arm64-setup.exe
          cp dist/fastcnsl-*-macos-arm64.dmg    upload/fastcnsl-macos-arm64.dmg
          ls -l upload
      # The AppImage's update information points at this file in the latest
      # release (scripts/package/linux-x86_64.sh), so updaters download only
      # the changed blocks.
      - name: AppImage update file
        run: |
          sudo apt-get install -y --no-install-recommends zsync
          cd upload
          zsyncmake -u fastcnsl-linux-x86_64.AppImage \
            -o fastcnsl-linux-x86_64.AppImage.zsync fastcnsl-linux-x86_64.AppImage
      - name: Checksums
        run: cd upload && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v$VERSION"
          # A re-run of the same commit replaces its release.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" upload/* \
            --target "$GITHUB_SHA" \
            --title "fastcnsl $VERSION" \
            --notes "Build ${VERSION##*.} of \`main\` (${GITHUB_SHA::7}). Downloads: see the assets below." \
            --latest

  # Package repositories on GitHub Pages (README "Install"):
  #   https://<owner>.github.io/<repo>/apt   Debian, Ubuntu
  #   https://<owner>.github.io/<repo>/rpm   Fedora, RHEL, openSUSE
  # Each holds the latest build only; older ones are on the releases page.
  # One-time setup, until then this job is skipped:
  # - Settings → Pages → Source: GitHub Actions
  # - Settings → Secrets → Actions: REPO_SIGNING_KEY = an armored gpg RSA
  #   secret key without a passphrase; it signs both repositories. Keep the
  #   same key forever: users trust it once, a new key breaks their updates.
  repos:
    name: Publish package repositories
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check the signing key
        id: key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "::warning::REPO_SIGNING_KEY is not set; package repositories not published"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$REPO_SIGNING_KEY" | gpg --batch --import
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: fastcnsl-linux-x86_64
          path: dist
      - name: Build the repositories
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          APT_REPO_URL="$SITE/apt" scripts/apt-repo.sh site/apt dist/*.deb
          RPM_REPO_URL="$SITE/rpm" scripts/rpm-repo.sh site/rpm dist/*.rpm
          touch site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><title>fastcnsl packages</title>\n<p><a href="apt/">apt repository</a> (Debian, Ubuntu) · <a href="rpm/">rpm repository</a> (Fedora, RHEL, openSUSE)\n' > site/index.html
      - uses: actions/configure-pages@v5
        if: steps.key.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.ok == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.key.outputs.ok == 'true'
        id: deploy
