# Builds ragamuffin for every platform. Unit tests are not run here; run
# them locally with `make tests`.
#
# - Pull requests: lints + all packages, uploaded as workflow artifacts.
# - Push to main: the same, then the "nightly" pre-release on the Releases
#   page is replaced with the new packages.
# - Tag v*: a versioned release with the packages attached.
#
# Linux and Windows packages are built with the same Docker images and
# Makefile targets as locally. macOS is built natively on GitHub's Apple
# Silicon runner, which has Apple's own SDK, so CI never downloads the
# macOS SDK from a third-party mirror (make macos-arm64 does that locally).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-dev-
      - run: make clippy

  docker-packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            packages: linux-x86_64-deb linux-x86_64-appimage
          - target: windows-x86_64
            packages: windows-x86_64-zip
          - target: windows-arm64
            packages: windows-arm64-zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-
      - name: Compile
        run: make ${{ matrix.target }}
      - name: Package
        run: make ${{ matrix.packages }}
      - uses: actions/upload-artifact@v4
        with:
          name: ragamuffin-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install 1.91 --profile minimal --target aarch64-apple-darwin
          rustup default 1.91
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - name: Compile
        run: scripts/package/macos-arm64.sh build
      - name: Package
        run: scripts/package/macos-arm64.sh zip
      - uses: actions/upload-artifact@v4
        with:
          name: ragamuffin-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [lint, docker-packages, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Fixed names (no version) so README download links never change.
      - name: Name the files for download links
        run: |
          mkdir upload
          cp dist/ragamuffin_*_amd64.deb         upload/ragamuffin-linux-x86_64.deb
          cp dist/Ragamuffin-*-x86_64.AppImage   upload/ragamuffin-linux-x86_64.AppImage
          cp dist/ragamuffin-*-windows-x86_64.zip upload/ragamuffin-windows-x86_64.zip
          cp dist/ragamuffin-*-windows-arm64.zip  upload/ragamuffin-windows-arm64.zip
          cp dist/ragamuffin-*-macos-arm64.zip    upload/ragamuffin-macos-arm64.zip
          ls -l upload
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" upload/* \
              --title "ragamuffin $GITHUB_REF_NAME" \
              --generate-notes --verify-tag
          else
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly upload/* \
              --prerelease --target "$GITHUB_SHA" \
              --title "Nightly build" \
              --notes "Latest build of \`main\` (${GITHUB_SHA::7}), replaced on every push. For stable versions, see the releases tagged v*."
          fi
