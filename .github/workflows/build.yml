# Builds and tests ragamuffin for every platform.
#
# - Pull requests: tests + all packages, uploaded as workflow artifacts.
# - Push to main: the same, then the "nightly" pre-release on the Releases
#   page is replaced with the new packages.
# - Tag v*: a versioned release with the packages attached.
#
# Linux and Windows packages are built with the same Docker images and
# Makefile targets as locally. macOS is built natively on GitHub's Apple
# Silicon runner, which has Apple's own SDK, so CI never downloads the
# macOS SDK from a third-party mirror (make macos-arm64 does that locally).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-dev-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-dev-
      - run: make test
      - run: make clippy

  docker-packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, windows-x86_64, windows-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/cargo
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-
      - run: make ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ragamuffin-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install 1.91 --profile minimal --target aarch64-apple-darwin
          rustup default 1.91
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-
      - run: scripts/package/macos-arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ragamuffin-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: [test, docker-packages, macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "ragamuffin $GITHUB_REF_NAME" \
              --generate-notes --verify-tag
          else
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly dist/* \
              --prerelease --target "$GITHUB_SHA" \
              --title "Nightly build" \
              --notes "Latest build of \`main\` (${GITHUB_SHA::7}), replaced on every push. For stable versions, see the releases tagged v*."
          fi
