[package]
name = "fastcnsl-wsl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Runs a WSL shell on a Linux pty for fastcnsl on Windows, bypassing ConPTY"
publish = false

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
